volumes:
  fdb_volume:

x-s3_common_depends: &s3_common_depends
  depends_on:
    s3:
      condition: service_healthy
    # - graphite
  links:
    - s3
    # - graphite

x-s3_throttling_depends: &s3_throttling_depends
  depends_on:
    s3-for-throttling:
      condition: service_started
    # - graphite
  links:
    - s3-for-throttling
    # - graphite

services:
  golang:
    build:
      dockerfile: ./docker/golang/Dockerfile
      context: .
      args:
        GO_VERSION: ${GO_VERSION}
    image: wal-g/golang
    container_name: wal-g_golang

  ubuntu:
    build:
      dockerfile: ./docker/ubuntu/Dockerfile
      context: .
    image: wal-g/ubuntu:18.04
    container_name: wal-g_ubuntu

  ubuntu_22_04:
    build:
      dockerfile: ./docker/ubuntu/Dockerfile_22_04
      context: .
    image: wal-g/ubuntu:22.04
    container_name: wal-g_ubuntu_22_04

  swift:
    image: openstackswift/saio:py3
    container_name: wal-g_swift
    hostname: swift
    ports:
      - "8010:8080"

  # "WALG_STATSD_ADDRESS": "wal-g_graphite:8125"
  graphite:
    image: hopsoft/graphite-statsd
    hostname: wal-g_graphite
    container_name: wal-g_graphite
    ports:
      - "8125:8125"
      - "8126:8126"
      - "2003:2003"
      - "2023:2023"
      - "2004:2004"
      - "2024:2024"
      - "80:80"
      - "81:81"
      - "3000:3000"

  s3:
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    container_name: wal-g_s3
    hostname: s3
    ports:
      - "9000:9000"
    environment:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      S3_BUCKET: fullbucket,fullbucket-compression-none-encryption,fullratingcomposerbucket,fulldatabasecomposerbucket,fullcopycomposerbucket,fullwithoutfilesmetadatabucket,fullscandeltabucket,failoverstoragebucket,partialbucket,remotebucket,remotewithoutfilesmetadatabucket,cryptobucket,waldeltabucket,ghostbucket,compressionbucket,deleteretainafterbucket,copyallbucket,copybackupbucket,compressionreversebucket,delete-retain-full-bucket,delete-retain-full-multist-bucket,delete-retain-full-multist-fo-bucket,delete-retain-find-full-bucket,delete-before-name-find-full-bucket,delete-before-time-find-full-bucket,delete-before-permanent-full-bucket,delete-before-permanent-delta-bucket,delete-before-permanent-delta-multist-bucket,delete-before-permanent-delta-multist-fo-bucket,delete-without-confirm-bucket,delete-end-to-end-bucket,delete-end-to-end-fo-bucket,delete-target-bucket,delete-target-delta-find-full-bucket,delete-target-delta-bucket,delete-target-delta-multist-bucket,delete-target-delta-multist-fo-bucket,delete-garbage-bucket,delete-garbage-multist-bucket,delete-garbage-multist-fo-bucket,gpdeletetargetbucket,gpdeletegarbagebucket,gp-journal-test-bucket,gp-shared-size-test-bucket,cloudberry-delete-target-bucket,cloudberry-delete-garbage-bucket,mysqlfullxtrabackupbucket,mysqlincrementalxtrabackupbucket,mysqlsplitfilesizebucket,mysqlfullxtrabackupwithrangesbucket,mysqlfullmysqldumpbucket,mysqlbinlogpushfetchbucket,mysqldeleteendtoendbucket,mysqldeleteeverythingpermanent,mysqldeleteincrementalxtrabackupbucket,mysqlmarkbucket,mysqlmarknoerrorbucket,mysqlmarkincrementalbucket,mysqlbinlogreplaybucket,mysql-pitr-binlogserver-bucket,mysql-pitr-binlogserver-reconnection-bucket,mysql-pitr-binlogserver-until-lmt-bucket,mysqlpitrxtrabackupbucket,mysqlpitrmysqldumpbucket,mysqllivereplay,mysqlpermanentbackupbucket,mysql-journal-test-bucket,mysql8-xbtool-bucket,mysql8-xbtool-incremental-bucket,mysql8-xbtool-inplace-bucket,mariadb-binlog-push-fetch,mariadb-binlog-push-with-gtids-check,mariadb-full-mysqldump,mariadb-full-maria-backup,mariadb-pitr-xtrabackup,mariadb-pitr-mariabackup-full,mongostreampushbucket,mongooplogpushbucket,mongodeletebeforebucket,mongodeleteretainbucket,redisbucket,mysqlcopybackupfrom,mysqlcopybackupto,mysqlconfonly,mysqldeletebinlogs,archivereadyrename,gp-follow-primary-bucket,gpfullbucket,gpafterfailedbucket,gpdeletewithoutconfirm,gpdeleteretainbucket,gpdeletebeforepermanentbucket,gpdeletebeforenamebucket,gpdeletebeforetimebucket,gpaostoragetestbucket,gpdeltabackuptestbucket,gppartialtablebucket,cloudberry-follow-primary-bucket,cloudberry-full-bucket,cloudberry-after-failed-bucket,cloudberry-delete-without-confirm,cloudberry-delete-retain-bucket,cloudberry-delete-before-permanent-bucket,cloudberry-delete-before-name-bucket,cloudberry-delete-before-time-bucket,cloudberry-aostorage-test-bucket,cloudberry-paxstorage-test-bucket,cloudberry-journal-test-bucket,cloudberry-shared-size-test-bucket,cloudberry-delta-backup-test-bucket,cloudberry-partial-table-bucket,createrestorepointbucket,storagetoolsbucket,storagetoolsbucket-target,sttransferfilesbucket,sttransferfilesfailoverbucket,transferbackupbucket,walrestorebucket,daemonbucket,backupmarkimpermanentbucket,backupmarkpermanentnoerrorbucket,backupmarkpermanentbucket,backupperftestbucket,catchupbucket,fullstreamedbucket,receivewalbucket,severaldeltabackupsbucket,walperftestbucket,pg-journal-test-bucket,orioledb-compatibility,orioledb-simple,orioledb-compressed
    command: "mini -s3.port=9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status && wget -S --spider http://127.0.0.1:9000 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  s3-another:
