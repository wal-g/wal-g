    environment:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLEBUTANOHER
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEYBUTANOTHERTOO
      S3_BUCKET: mysqlcopybackupto
    command: "mini -s3.port=9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status && wget -S --spider http://127.0.0.1:9000 2>&1 | grep -q 'HTTP/1.1'"]
