  # The PG 10 bionic image uses pgBackRest 2.36, because 2.54 and later need
  # meson; 14-18 use 2.59.0. The build image must use the same Ubuntu version as
  # the target image, or the binary will not run.
  pg_pgbackrest:
    build:
      dockerfile: docker/pg_tests/Dockerfile_pgbackrest
      context: .
      args:
        PGBACKREST_BUILD_BASE: "${PGBACKREST_BUILD_BASE:-ubuntu:22.04}"
        PGBACKREST_VERSION: "${PGBACKREST_VERSION:-2.59.0}"
        PG_TESTS_IMAGE: wal-g/pg${PG_MAJOR}_tests:latest
    image: wal-g/pgbackrest_pg${PG_MAJOR}

