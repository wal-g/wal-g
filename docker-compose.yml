  pg10:
    build:
      dockerfile: docker/pg/Dockerfile
      context: .
    image: wal-g/pg10
    container_name: wal-g_pg10

  pg10_tests_template:
    build:
      dockerfile: docker/pg_tests/Dockerfile_prefix
      context: .
    image: wal-g/pg10_tests
    container_name: wal-g_pg10_tests_template
    <<: *s3_common_depends

  # One build for any version: PG_MAJOR chooses the release, and 14-18 are
  # installed from PGDG on ubuntu 22.04. PG 10 has its own services above,
  # because the wale_* tests need wal-e, which only runs on python3.7.
  pg:
    build:
      dockerfile: docker/pg/Dockerfile
      context: .
      args:
        UBUNTU_TAG: "22.04"
        PG_MAJOR: "${PG_MAJOR}"
        USE_PGDG: "1"
        INSTALL_WALE: "0"
    image: wal-g/pg${PG_MAJOR}

  pg_tests_template:
    build:
      dockerfile: docker/pg_tests/Dockerfile_prefix
      context: .
      args:
        PG_IMAGE: wal-g/pg${PG_MAJOR}:latest
    image: wal-g/pg${PG_MAJOR}_tests
    <<: *s3_common_depends

  # Test services, for any PG_MAJOR whose image is built.
  pg_test_common: &pg_test_common
    image: wal-g/pg${PG_MAJOR}_tests
    user: postgres
    <<: *s3_common_depends

  pg_full_backup_test:
    <<: *pg_test_common
    container_name: wal-g_pg${PG_MAJOR}_full_backup_test
    command: /tmp/tests/full_backup_test.sh

  pg_test_throttling: &pg_test_throttling
    image: wal-g/pg${PG_MAJOR}_tests
    user: postgres
    <<: *s3_throttling_depends

  pg_tests:
    <<: *pg_test_common
    container_name: wal-g_pg${PG_MAJOR}_tests
    command: /tmp/run_integration_tests.sh

  pg_storage_swift_test:
    image: wal-g/pg${PG_MAJOR}_tests
    container_name: wal-g_pg${PG_MAJOR}_storage_swift_test
    command: /tmp/test_bins/swift.test -test.v
    depends_on:
      - swift
    links:
      - swift
    environment:
      - "PG_TEST_STORAGE=swift"
      - "OS_USERNAME=test:tester"
      - "OS_PASSWORD=testing"
      - "OS_AUTH_URL=http://swift:8080/auth/v1.0"

  pg_storage_ssh_test:
    image: wal-g/pg${PG_MAJOR}_tests
    container_name: wal-g_pg${PG_MAJOR}_storage_ssh_test
    command: /tmp/test_bins/sh.test -test.v
    depends_on:
      - ssh
    links:
      - ssh
    environment:
      - "PG_TEST_STORAGE=ssh"

