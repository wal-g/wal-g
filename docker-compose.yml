      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      S3_BUCKET: walperftestbucket
    command: "mini -s3.port=9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status && wget -S --spider http://127.0.0.1:9000 2>&1 | grep -q 'HTTP/1.1'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  s3-for-throttling:
    build:
      context: docker/s3_fault_proxy
    image: wal-g/s3-fault-proxy:latest
    container_name: wal-g_s3_3
    hostname: s3
    ports:
      - "9000:9000"
    depends_on:
      s3-throttling-backend:
        condition: service_healthy
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]

  ssh:
    build:
      dockerfile: docker/ssh/Dockerfile
      context: .
    container_name: wal-g_ssh
    ports:
