name: Build and Push Golang Image

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-golang:
    name: Build & Push wal-g/golang
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'wal-g' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same derivation as GO_VERSION in the Makefile.
      - name: Read Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push wal-g/golang
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/golang/Dockerfile
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/golang:latest
            ghcr.io/${{ github.repository_owner }}/golang:${{ steps.go.outputs.version }}
