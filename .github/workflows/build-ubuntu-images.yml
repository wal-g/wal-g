name: Build and Push Ubuntu Images

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-ubuntu:
    name: Build & Push wal-g/ubuntu:${{ matrix.tag }}
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'wal-g' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "18.04"
            dockerfile: docker/ubuntu/Dockerfile
          - tag: "22.04"
            dockerfile: docker/ubuntu/Dockerfile_22_04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push wal-g/ubuntu:${{ matrix.tag }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ubuntu:${{ matrix.tag }}
