name: Docker tests

on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
    inputs:
      pg_versions:
        description: 'Space-separated PostgreSQL majors to test; empty = all supported'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  GOPROXY: "https://proxy.golang.org|direct"

jobs:
  # Run the whole test suite once for each PostgreSQL version. The versions run
  # at the same time, so more versions cost more machine time but almost no
  # extra waiting. A manual run can test fewer versions, see pg_versions above.
  prepare:
    name: resolve versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
      commands: ${{ steps.resolve.outputs.commands }}
    steps:
      - name: Cleanup space on runner
        run: |
          swapon --show=NAME --noheadings | while read swap_device; do
            sudo swapoff $swap_device
          done

          if [ -e /swapfile ]; then
            sudo rm /swapfile
          fi

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build the command list
        id: resolve
        env:
          # empty on push and pull_request, and whenever a manual run leaves it
          # blank. Not named PG_VERSIONS: make treats an empty environment
          # variable as set, and ?= in the Makefile would not override it.
          INPUT_PG_VERSIONS: ${{ inputs.pg_versions }}
        run: |
          # the Makefile owns the list of supported versions
          versions="${INPUT_PG_VERSIONS:-$(make -s print_pg_versions)}"
          if [ -z "$versions" ]; then
            echo "empty version list; is print_pg_versions still in the Makefile?" >&2
            exit 1
          fi

          pg=$(for v in $versions; do
            printf '"make PG_MAJOR=%s pg_integration_test",' "$v"
          done)

          mysql=$(for series in 57 80 84 97; do
            printf '"make MYSQL_SERIES=%s mysql_integration_test USE_BROTLI= USE_LZO= USE_LIBSODIUM=",' "$series"
          done)

          # The heredoc is quoted, so the shell keeps the backslashes as they are.
          engines=$(cat <<'EOF'
          "make MONGO_VERSION=\"8.0.3\" MONGO_REPO=\"repo.mongodb.org\" MONGO_PACKAGE=\"mongodb-org\" mongo_catch_up_features",
          "make MONGO_VERSION=\"8.0.3\" MONGO_REPO=\"repo.mongodb.com\" MONGO_PACKAGE=\"mongodb-enterprise\" mongo_catch_up_features",
          "make MONGO_VERSION=\"8.0.3\" MONGO_REPO=\"repo.mongodb.com\" MONGO_PACKAGE=\"mongodb-enterprise\" mongo_binary_features",
          "make MONGO_VERSION=\"8.0.3\" MONGO_REPO=\"repo.mongodb.org\" MONGO_PACKAGE=\"mongodb-org\" mongo_logical_features",
          "make MONGO_VERSION=\"8.0.3\" MONGO_REPO=\"repo.mongodb.com\" MONGO_PACKAGE=\"mongodb-enterprise\" mongo_partial_features",
          "make MONGO_VERSION=\"7.0.15\" MONGO_REPO=\"repo.mongodb.org\" MONGO_PACKAGE=\"mongodb-org\" mongo_catch_up_features",
          "make MONGO_VERSION=\"7.0.15\" MONGO_REPO=\"repo.mongodb.com\" MONGO_PACKAGE=\"mongodb-enterprise\" mongo_catch_up_features",
          "make MONGO_VERSION=\"7.0.15\" MONGO_REPO=\"repo.mongodb.com\" MONGO_PACKAGE=\"mongodb-enterprise\" mongo_binary_features",
          "make MONGO_VERSION=\"7.0.15\" MONGO_REPO=\"repo.mongodb.org\" MONGO_PACKAGE=\"mongodb-org\" mongo_logical_features",
          "make MONGO_VERSION=\"7.0.15\" MONGO_REPO=\"repo.mongodb.com\" MONGO_PACKAGE=\"mongodb-enterprise\" mongo_partial_features",
          "make redis_test",
          "make FEATURE=\"ts_backup\" REDIS_VERSION=\"7.2.4\" redis_features",
          "make FEATURE=\"rdb_ts_backup\" REDIS_VERSION=\"7.2.4\" redis_features",
          "make FEATURE=\"aof_ts_backup\" REDIS_VERSION=\"7.2.4\" redis_features",
          "make FEATURE=\"aof_backup\" REDIS_VERSION=\"7.0.15\" redis_features",
          "make FEATURE=\"aof_backup\" REDIS_VERSION=\"7.2.4\" redis_features",
          "make FEATURE=\"rdb_backup\" REDIS_VERSION=\"6.2.4\" redis_features",
          "make FEATURE=\"rdb_backup\" REDIS_VERSION=\"7.0.15\" redis_features",
          "make FEATURE=\"rdb_backup\" REDIS_VERSION=\"7.2.4\" redis_features",
          "make mariadb_test",
          "make gp_test",
          "make cloudberry_test",
          "make st_test",
          "make etcd_test",
          "make orioledb_integration_test"
          EOF
          )

          commands="[${pg}${mysql}$(printf '%s' "$engines" | tr -d '\n' | sed 's/^ *//; s/ *$//')]"

          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "commands=$commands" >> "$GITHUB_OUTPUT"
          echo "PostgreSQL: $versions"

  parallel:
    needs: prepare
    uses: ./.github/workflows/dockertests.yml
    with:
      command-json-array: ${{ needs.prepare.outputs.commands }}
