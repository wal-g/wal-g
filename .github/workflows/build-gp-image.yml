name: Build and Push GP Image

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-gp:
    name: Build & Push wal-g/gp
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'wal-g' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push wal-g/gp
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/gp/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gp:latest