version: 2

# External release archives such as libsodium are updated by
# .github/workflows/update-libsodium-version.yml because Dependabot only
# supports manifest-backed ecosystems and GitHub Actions references.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependabot:
        patterns:
          - "github.com/aws/aws-sdk-go-v2"
          - "github.com/aws/aws-sdk-go-v2/*"
          - "go.opentelemetry.io/otel"
          - "go.opentelemetry.io/otel/*"
          - "github.com/Azure/azure-sdk-for-go/*"
          - "cloud.google.com/go"
          - "cloud.google.com/go/*"
          - "github.com/klauspost/compress"
          - "github.com/pierrec/lz4/v4"
  - package-ecosystem: "gomod"
    directory: "/cmd/pg/exporter"
    schedule:
      interval: "weekly"
